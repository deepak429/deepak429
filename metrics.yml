# Generates github-metrics.svg inside your own repo — no external service to go down.
#
# Setup:
#   1. Create a classic GitHub token (Settings → Developer settings → Personal
#      access tokens → Tokens (classic)) with the `repo` scope.
#   2. In deepak429/deepak429 → Settings → Secrets and variables → Actions,
#      add a secret named METRICS_TOKEN with that token as the value.
#   3. Commit this file to .github/workflows/metrics.yml
#   4. Actions tab → Metrics → Run workflow (to generate it the first time).

name: Metrics

on:
  schedule:
    - cron: "0 2 * * *"     # daily at 02:00 UTC
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: deepak429
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_display: large

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: deepak429
          filename: github-languages.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
